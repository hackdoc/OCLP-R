name: Bug Report
description: File a bug report
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!(感谢您花时间填写这份错误报告！)
  - type: dropdown
    id: machine
    attributes:
      label: Machine Model(机型)
      description: What model was being patched?(哪个型号正在被修补？)
